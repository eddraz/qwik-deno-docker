name: Deploy
on:
  push:
    branches: main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build
        run: |
          cat .env
          npm install
          npm run build

      - uses: denoland/deployctl@v1
        with:
          project: "qwik-docker"
          entrypoint: "./server/entry.deno.js"
          include: |
            server/**/*
            dist/**/*
            package.json
            .env
